name: CI

on:
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: |
            src/WiseLine.Portal.Web/package-lock.json
            tools/mcp-wiselineportal-db/package-lock.json

      - name: Restore and build .NET
        shell: pwsh
        run: |
          dotnet restore WiseLine.Portal.sln
          dotnet build WiseLine.Portal.sln --configuration Release --no-restore -warnaserror

      - name: Validate Angular
        working-directory: src/WiseLine.Portal.Web
        shell: pwsh
        run: |
          npm ci
          npm audit --audit-level=high
          npm run format:check
          npm run test:ci
          npm run build

          $indexPath = 'dist/WiseLine.Portal.Web/browser/index.html'
          $indexHtml = Get-Content -LiteralPath $indexPath -Raw
          $stylesheetLinks = [regex]::Matches(
            $indexHtml,
            '<link\b[^>]*\brel="stylesheet"[^>]*>')

          if ($stylesheetLinks.Count -eq 0) {
            throw 'The Angular production build does not contain a stylesheet link.'
          }

          foreach ($stylesheetLink in $stylesheetLinks) {
            if ($stylesheetLink.Value -match '\bonload=' -or
                $stylesheetLink.Value -match '\bmedia="print"') {
              throw 'The Angular stylesheet requires an inline load handler that is blocked by the portal CSP.'
            }
          }

          Write-Output 'Angular stylesheet loading is compatible with the portal CSP.'

      - name: Copy Angular into API web root
        shell: pwsh
        run: |
          $webRoot = 'src/WiseLine.Portal.Api/wwwroot'
          New-Item -ItemType Directory -Path $webRoot -Force | Out-Null
          Copy-Item -Path 'src/WiseLine.Portal.Web/dist/WiseLine.Portal.Web/browser/*' -Destination $webRoot -Recurse -Force

      - name: Test .NET
        run: dotnet test WiseLine.Portal.sln --configuration Release --no-build --no-restore

      - name: Validate database MCP development tool
        working-directory: tools/mcp-wiselineportal-db
        shell: pwsh
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm test
          npm run build
